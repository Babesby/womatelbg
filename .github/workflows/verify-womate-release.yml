name: Verify WOMATE release build
on:
  push:
    branches:
      - womate-release-nov11
      - cohort3-admin-polish-nov11
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The existing package-lock.json is out of sync with package.json.
      # Build-test the existing app without modifying the lockfile in this UI release.
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
      - run: npm run build
