name: Verify WOMATE release build
on:
  push:
    branches:
      - womate-release-nov11
      - cohort3-admin-polish-nov11
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
