<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#0E4D4A"
    />

    <!-- FAVICON -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="shortcut icon"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- FONTS -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- SEO -->
    <title>WOMATE | African Women Leading Climate Action</title>

    <meta
      name="description"
      content="WOMATE equips African women to lead climate action through knowledge, sustainable technology, research, community and leadership."
    />

    <link
      rel="canonical"
      href="https://www.womate.org/"
    />

    <!-- OPEN GRAPH -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="WOMATE"
    />

    <meta
      property="og:title"
      content="WOMATE | African Women Leading Climate Action"
    />

    <meta
      property="og:description"
      content="Driving inclusive climate action through sustainable technology and community leadership."
    />

    <meta
      property="og:url"
      content="https://www.womate.org/"
    />

    <meta
      property="og:image"
      content="https://www.womate.org/favicon.png"
    />

    <!-- ORGANIZATION SCHEMA -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "WOMATE",
        "alternateName": "Women in Climate",
        "url": "https://www.womate.org/",
        "logo": "https://www.womate.org/favicon.png",
        "email": "womatead@gmail.com",
        "sameAs": [
          "https://www.linkedin.com/company/womeninclimategh"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
